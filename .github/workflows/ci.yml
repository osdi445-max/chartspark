name: CI + Model Downloads

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      download_diffusion_models:
        description: "Download the three large Stable Diffusion models (slow, ~15 GB)"
        required: false
        type: boolean
        default: false

jobs:
  backend-with-models:
    runs-on: ubuntu-latest
    # Increase timeout because model downloads can take a while
    timeout-minutes: 90

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.9"
          environment-file: environment.yml
          activate-environment: chartspark
          auto-activate-base: false
          use-mamba: true

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            mask/
          key: hf-models-${{ hashFiles('environment.yml') }}-${{ github.sha }}
          restore-keys: |
            hf-models-${{ hashFiles('environment.yml') }}-
            hf-models-

      # -------------------------------------------------
      # 1. Background removal model (always download)
      # -------------------------------------------------
      - name: Download background-removal model
        run: |
          mkdir -p mask
          if [ ! -f mask/bg_removal.pth ]; then
            echo "Downloading bg_removal model from Google Drive..."
            gdown --id 1XHIzgTzY5BQHw140EDIgwIb53K659ENH -O mask/bg_removal.pth
          else
            echo "bg_removal.pth already present (from cache)"
          fi
          ls -lh mask/

      # -------------------------------------------------
      # 2. Optional: large diffusion models
      # -------------------------------------------------
      - name: Download Stable Diffusion models (optional)
        if: ${{ github.event.inputs.download_diffusion_models == 'true' || contains(github.event.pull_request.labels.*.name, 'download-models') }}
        env:
          HF_HOME: ${{ github.workspace }}/.cache/huggingface
        run: |
          echo "Downloading large diffusion models (this can take 20-40 minutes)..."
          python -c "
          from huggingface_hub import snapshot_download
          import os

          models = [
              'runwayml/stable-diffusion-v1-5',
              'stabilityai/stable-diffusion-2-depth',
              'Fantasy-Studio/Paint-by-Example',
          ]
          for repo_id in models:
              print(f'Downloading {repo_id} ...')
              snapshot_download(
                  repo_id=repo_id,
                  cache_dir=os.environ['HF_HOME'],
                  local_files_only=False,
              )
              print(f'Finished {repo_id}')
          "

      - name: Verify models & environment
        run: |
          conda list
          python -c "
          import torch, diffusers, flask, gdown
          print('Core packages OK')
          print('Torch:', torch.__version__)
          "

          # Quick check that the background model exists
          import os
          assert os.path.isfile('mask/bg_removal.pth'), 'bg_removal.pth missing!'
          print('Background removal model is present')

      # -------------------------------------------------
      # 3. Example integration test placeholder
      # -------------------------------------------------
      - name: Run integration tests (example)
        run: |
          # Replace this with your real test command
          # e.g. python -m pytest tests/integration/ -v
          echo "Integration tests would run here"
          # Example smoke test:
          python -c "
          from diffusers import StableDiffusionPipeline
          print('diffusers import successful')
          "

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install & build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
