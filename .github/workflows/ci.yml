name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:   # allows manual runs

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}   # required so conda activate works

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache conda
        uses: actions/cache@v4
        with:
          path: ${{ env.CONDA }}/envs
          key: conda-${{ runner.os }}-${{ hashFiles('environment.yml') }}

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.9"
          environment-file: environment.yml
          activate-environment: chartspark
          auto-activate-base: false
          use-mamba: true          # much faster than classic conda

      - name: Verify environment
        run: |
          conda info
          conda list
          python -c "import torch, diffusers, flask; print('Core packages OK')"

      # Optional: run any tests / linting you have
      # - name: Run tests
      #   run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
